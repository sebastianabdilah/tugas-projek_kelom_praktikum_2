<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Barang</title>
</head>
<body>

    <!-- Menu Navigasi -->
    <table border="1" width="100%" cellpadding="5">
        <tr>
            <td align="center"><a href="#">Home</a></td>
            <td align="center"><a href="#">Generate Link</a></td>
            <td align="center"><a href="#">Transaction History</a></td>
            <td align="center"><a href="#">Policy</a></td>
            <td align="center"><a href="#">Logout</a></td>
        </tr>
    </table>

    <br>

    <!-- Form Pemesanan Barang -->
    <form action="praktikum 2_desainuiux_pemweb (2).html" method="get">
        <table cellpadding="5">
            <tr>
                <!-- Kolom kiri: upload gambar -->
                <td valign="top" width="250">
                    <img src="Galaxy S23 256GB.jpeg" alt="Foto HP" width="200" height="200">
                    <br><br>
                    <label for="picture">Upload Picture</label><br>
                    <input type="file" id="picture" name="picture" accept="image/*">
                </td>

                <!-- Kolom kanan: isian form -->
                <td valign="top">
                    <table cellpadding="5">
                        <tr>
                            <td align="right"><label for="title">Title Here :</label></td>
                            <td><input type="text" id="title" name="title" size="50" value="Samsung Galaxy S23 Rp 8.500.000"></td>
                        </tr>
                        <tr>
                            <td align="right" valign="top"><label for="description">Description :</label></td>
                            <td>
                                <textarea id="description" name="description" rows="5" cols="52">Year : 2023
Model : Galaxy S23 256GB
Condition : Mint</textarea>
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><label for="account_number">Account Number :</label></td>
                            <td><input type="text" id="account_number" name="account_number" size="50" value="123-456-789-0"></td>
                        </tr>
                        <tr>
                            <td align="right"><label for="bank">Bank :</label></td>
                            <td>
                                <select id="bank" name="bank">
                                    <option value="hsbc" selected>HSBC</option>
                                    <option value="bca">BCA</option>
                                    <option value="bni">BNI</option>
                                    <option value="bri">BRI</option>
                                    <option value="mandiri">Mandiri</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><label for="account_holder">Account Holder :</label></td>
                            <td><input type="text" id="account_holder" name="account_holder" size="50" placeholder="Name Here"></td>
                        </tr>
                        <tr>
                            <td align="right"><label for="transaction">Transaction :</label></td>
                            <td>
                                <select id="transaction" name="transaction">
                                    <option value="1" selected>1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <br>
                                <small>* If the transaction is for 3 person, choose 3 from the drop-down list</small>
                                <br>
                                <input type="checkbox" id="send_mobile" name="send_mobile" value="yes" checked>
                                <label for="send_mobile">Send to Mobile Phone</label>
                                <br>
                                <input type="checkbox" id="send_email" name="send_email" value="yes" checked>
                                <label for="send_email">Send to Email</label>
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><label for="mobile_phone">Send to Mobile Phone :</label></td>
                            <td><input type="text" id="mobile_phone" name="mobile_phone" size="50" value="1234567890, 1234567891"></td>
                        </tr>
                        <tr>
                            <td align="right"><label for="email">Send to Email :</label></td>
                            <td><input type="text" id="email" name="email" size="50" value="abdilah825@soton.ac.uk, fys_06@yahoo.com"></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><button type="submit">Generate Nabr Link</button></td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
